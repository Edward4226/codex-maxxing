name: originality

on:
  push:
  pull_request:

jobs:
  check:
    name: 15-gram overlap check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check originality
        run: python scripts/check_originality.py
